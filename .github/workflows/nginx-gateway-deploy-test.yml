name: opencoin-gateway-deploy-test

on:
  push:
    branches:
      - test
    paths:
      - "docker-compose.yml"
      - "environments/**"
      - "nginx/**"
      - "scripts/**"
      - ".github/workflows/nginx-gateway-deploy-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencoin-gateway-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    env:
      APP_ENV: test
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/projects/nginx-gateway' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package gateway files
        run: |
          set -eu
          mkdir -p .deploy
          tar -czf .deploy/nginx-gateway.tgz \
            docker-compose.yml \
            environments \
            nginx \
            scripts \
            README.md

      - name: Upload package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT || '22' }}
          username: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".deploy/nginx-gateway.tgz"
          target: "/tmp"
          strip_components: 1

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_ENV: ${{ env.APP_ENV }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        with:
          host: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT || '22' }}
          username: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: APP_ENV,DEPLOY_PATH,LETSENCRYPT_EMAIL
          script: |
            set -eu

            mkdir -p "$DEPLOY_PATH"
            rm -rf "$DEPLOY_PATH/environments" "$DEPLOY_PATH/nginx" "$DEPLOY_PATH/scripts"
            rm -f "$DEPLOY_PATH/docker-compose.yml" "$DEPLOY_PATH/README.md"
            tar -xzf /tmp/nginx-gateway.tgz -C "$DEPLOY_PATH"
            rm -f /tmp/nginx-gateway.tgz

            cd "$DEPLOY_PATH"
            chmod +x ./scripts/*.sh ./scripts/tests/*.sh
            APP_ENV="$APP_ENV" LETSENCRYPT_EMAIL="${LETSENCRYPT_EMAIL:-}" ./scripts/bootstrap.sh
            APP_ENV="$APP_ENV" ./scripts/compose.sh ps
