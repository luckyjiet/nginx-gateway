server {
  listen 80;
  listen [::]:80;
  server_name ${OPENCOIN_DOMAIN};
  client_max_body_size 25m;
  root /var/www/opencoin/${OPENCOIN_WEB_ENV};
  index index.html;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
