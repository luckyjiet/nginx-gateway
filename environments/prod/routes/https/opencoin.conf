server {
  listen 80;
  listen [::]:80;
  server_name ${OPENCOIN_DOMAIN};
  client_max_body_size 25m;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name ${OPENCOIN_DOMAIN};
  client_max_body_size 25m;
  root /var/www/opencoin/${OPENCOIN_WEB_ENV};
  index index.html;

  ssl_certificate /etc/letsencrypt/live/${OPENCOIN_CERT_NAME}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${OPENCOIN_CERT_NAME}/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:OPENCOINSSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
